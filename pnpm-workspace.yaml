# Refuse releases younger than 7 days (minutes). Moved from .npmrc in pnpm 11+,
# which only reads registry and auth settings there.
minimumReleaseAge: 10080

packages:
  - packages/*
  - examples/*

overrides:
  '@nestjs-ssr/react': link:packages/react
  # Security patches for transitive/auto-installed optional peers. None of these
  # ship in the published package (its dependencies are citty, consola, devalue
  # and escape-html); they are pinned so the repo's own tree audits clean.
  # Exact pins. minimumReleaseAge (above) is 10080, so a range would resolve
  # to a release too new to install. Bump these as newer patches mature.
  '@fastify/static': '10.1.5'
  '@nestjs/platform-fastify': '12.1.0'
  # Align the Nest adapter with the patched Fastify used by the test suite.
  '@nestjs/platform-fastify>fastify': '5.12.8'
  '@fastify/ajv-compiler>fast-uri': '3.1.9'
  'ajv>fast-uri': '3.1.9'
  'fast-json-stringify>fast-uri': '4.2.3'
  find-my-way: '9.10.0'
  qs: '6.17.1'
  # Glob and minimatch security fixes cross major versions. Keep the
  # legacy minimatch 3.x consumers on their existing line.
  'glob@>=9.0.0 <14.0.6': '14.0.6'
  'minimatch@>=7.0.0 <11.0.8': '11.0.8'
  # Fix GHSA-mrhx-c7xc-m3w5 in Knip's config validator.
  knip>zod: '4.6.6'
  # Dev tooling only: concurrently (example), postcss (vite, webpack),
  # hyperid (autocannon bench), got (@swc/cli). uuid 11 is the last line
  # with a CJS build.
  shell-quote: '1.12.0'
  http-cache-semantics: '4.3.0'
  source-map-js: '1.2.2'
  'hyperid>uuid': '11.1.1'
  # Patched request-teardown handling for the Nest Express adapter and Express.
  multer: '2.5.0'
  body-parser: '2.4.0'
  # vitest resolves its optional happy-dom peer to 20.x for workspaces that
  # don't declare it (examples/minimal). 21.0.4 fixes GHSA-834v-8h66-3h79,
  # GHSA-c8p4-j97h-3vg8 and GHSA-5fpq-26gf-qwcr.
  happy-dom: '21.0.4'
  # VitePress 1.6.4 declares Vite ^5.4.14. Force the patched 6.x release
  # for its dev-server advisories and check compatibility with docs:build.
  vitepress>vite: '6.4.6'

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  '@nestjs/core': false
  '@parcel/watcher': false

packageExtensions:
  # dependency-cruiser parses TypeScript through the classic compiler API,
  # which TypeScript 7 does not ship (it arrives in 7.1). It declares no
  # dependency on `typescript` and picked up the hoisted TS 7, so the boundary
  # rules ran on a degraded parse and passed silently. It alone gets the TS 6
  # API; everything else compiles and type-checks with TypeScript 7.
  dependency-cruiser:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
