# Refuse releases younger than 7 days (minutes). Moved from .npmrc in pnpm 11+,
# which only reads registry and auth settings there.
minimumReleaseAge: 10080

packages:
  - packages/*
  - examples/*

overrides:
  '@nestjs-ssr/react': link:packages/react
  # Security patches for transitive/auto-installed optional peers. None of these
  # ship in the published package (its dependencies are citty, consola, devalue
  # and escape-html); they are pinned so the repo's own tree audits clean.
  # Exact pins. minimumReleaseAge (above) is 10080, so a range would resolve
  # to a release too new to install. Bump these as newer patches mature.
  '@fastify/static': '10.1.3'
  '@nestjs/platform-fastify': '12.0.3'
  '@nestjs/platform-fastify>fastify': '5.12.5'
  '@fastify/ajv-compiler>fast-uri': '3.1.8'
  'ajv>fast-uri': '3.1.8'
  'fast-json-stringify>fast-uri': '4.1.5'
  find-my-way: '9.7.0'
  qs: '6.16.0'
  # @nestjs/platform-express 11.x ships multer 2.2.0, which has three high DoS
  # advisories (fixed in 2.3.0). The example still runs Nest 11; 12.0.3 ships
  # 2.4.0 itself, so pinning 2.4.0 serves both without downgrading either.
  multer: '2.4.0'
  # vitepress 1.6.4 (latest stable) pins vite ^5.4.14, and every fix for the
  # vite/esbuild dev-server advisories landed in 6.4.2+. Forced past the
  # declared range; docs:build is the check that this stays viable.
  vitepress>vite: '6.4.3'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, deeply nested patterns exhaust the stack. No patched
    # release exists. Only reached through http-proxy-middleware > micromatch,
    # an optional peer used by the development Vite proxy, where the patterns
    # are the library's own, not request input. Not in the published package.
    # Drop this once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  '@nestjs/core': false
  '@parcel/watcher': false

packageExtensions:
  # dependency-cruiser parses TypeScript through the classic compiler API,
  # which TypeScript 7 does not ship (it arrives in 7.1). It declares no
  # dependency on `typescript` and picked up the hoisted TS 7, so the boundary
  # rules ran on a degraded parse and passed silently. It alone gets the TS 6
  # API; everything else compiles and type-checks with TypeScript 7.
  dependency-cruiser:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
