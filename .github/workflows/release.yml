name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (leave empty for auto-detect from commits)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Full history for changelog

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        working-directory: packages/react

      - name: Build package
        run: pnpm build:package

      - name: Sync README
        run: cp README.md packages/react/README.md

      - name: Bump version and generate changelog
        id: version
        working-directory: packages/react
        run: |
          # Use changelogen to automatically bump version and generate changelog
          RELEASE_TYPE="${{ github.event.inputs.release-type }}"

          if [ -z "$RELEASE_TYPE" ]; then
            # Auto-detect from conventional commits
            pnpm exec changelogen --bump --release --output ../../CHANGELOG.md
          else
            # Use specified release type
            pnpm exec changelogen --$RELEASE_TYPE --release --output ../../CHANGELOG.md
          fi

          # Get the new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/react/package.json CHANGELOG.md
          git add -f packages/react/README.md
          git commit -m "chore(ci): Release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push
          git push --tags

      - name: Publish to npm
        run: |
          cd packages/react
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
